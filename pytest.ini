[pytest]
testpaths = tests
python_files = test_*.py

# Files named test_*.py under scripts/ are executable research diagnostics.
# They perform long-running work at import time and are not pytest modules.
# norecursedirs (2026-08-16): never collect scripts/ (test_ppo_ratio_fix.py
# runs a full training at import time and was once collected by pytest), the
# virtualenv, or experiment outputs.
norecursedirs = scripts pytrch_ven .git .pytest_cache results
