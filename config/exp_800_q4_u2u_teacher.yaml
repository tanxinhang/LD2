# EXPERIMENTAL / NEGATIVE-RESULT REPRODUCTION ONLY.
# Medium tracking-free U2U-ISAC assignment-teacher experiment. Offline
# assignment converges, but the physical recurrent-inbox checkpoint does not
# beat the recommended QoS-attention actor; see U2U_QOS_PROBE_RESULTS.md.
#
# This file deliberately inherits the canonical U2U defaults.  The historical
# exp_800_q4.yaml predates config inheritance and therefore falls back to older
# dataclass values for fields it does not list (moving targets, free/no-token
# communication).  Use this file for the cost-aware communication study.
extends: default.yaml

scenario:
  region_size: [800, 800]
  K: 4
  Q: 4
  T: 150
  dt: 0.1

target:
  omega_q: [0.25, 0.25, 0.25, 0.25]

marl:
  # Stable Medium training settings used by the fixed-seed probes.
  ppo_clip: 0.1
  ppo_epochs: 2
  rollout_steps: 2048
  minibatch_size: 256
  entropy_init: 0.03
  entropy_final: 0.005
  entropy_decay_frames: 500000
  assignment_hold_frames: 5
  actor_decision_interval: 5
  num_envs: 8
  eval_seeds: [10001, 10002, 10003, 10004, 10005]
  eval_interval: 10
  eval_episodes: 5

  # Reproduce the failed hard-8-bit probe instead of the current soft default.
  comm_encouragement_enabled: false
  comm_qos_min_rate_bits: 8
  comm_qos_rate_shortfall_penalty: 0.10
  comm_qos_rate_aux_coef: 0.20

  # Supervised CTDE signal breaks the uniform-assignment stationary point.
  # The teacher is absent at execution; movement and message content are still
  # produced by the decentralized shared MAPPO actor.
  target_allocation_enabled: false
  target_allocation_teacher_enabled: true
  target_allocation_teacher_label_coef: 0.30
  target_allocation_teacher_movement_coef: 1.00
  # No fixed semantic message label: assignment/movement errors train message
  # contents end-to-end through a straight-through 8-bit U2U channel.
  target_allocation_teacher_message_coef: 0.00
  target_allocation_teacher_epochs: 8
  target_allocation_teacher_differentiable_comm: true
  target_allocation_sinkhorn_enabled: true
