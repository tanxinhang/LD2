# Integration-only smoke test for the CTDE set/distributional risk critic.
# Actor topology and decentralized execution remain identical to the paper
# top-1 configuration.
extends: exp_800_q4_u2u_hierarchical_multistatic_distributed_matching_hybrid50_paper_top1_eval.yaml

scenario:
  T: 12

marl:
  set_risk_critic_enabled: true
  risk_critic_hidden_dim: 64
  risk_critic_num_quantiles: 8
  risk_critic_cvar_alpha: 0.20
  risk_critic_qos_floor: 0.60
  risk_critic_quantile_coef: 0.25
  risk_critic_constraint_coef: 0.10
  risk_critic_constraint_positive_weight: 0.0
  risk_critic_only_training: true
  rollout_steps: 16
  num_envs: 2
  minibatch_size: 16
  ppo_epochs: 1
  early_stop: false
  checkpoint_confirmation_enabled: false
  eval_episodes: 1
