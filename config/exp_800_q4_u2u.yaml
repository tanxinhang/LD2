# Canonical Medium tracking-free U2U-ISAC experiment.
# Inherits the physical learned-message channel, QoS constraints and soft
# communication encouragement from default.yaml. No ground link, tracker or
# experimental target-allocation teacher is enabled.
extends: default.yaml

scenario:
  region_size: [800, 800]
  K: 4
  Q: 4
  T: 150
  dt: 0.1

target:
  omega_q: [0.25, 0.25, 0.25, 0.25]

marl:
  ppo_clip: 0.1
  ppo_epochs: 2
  rollout_steps: 2048
  minibatch_size: 256
  entropy_init: 0.03
  entropy_final: 0.005
  entropy_decay_frames: 500000
  assignment_hold_frames: 5
  actor_decision_interval: 5
  num_envs: 8
  eval_seeds: [10001, 10002, 10003, 10004, 10005]  # legacy fallback
  eval_seed_bank_path: config/stratified_seeds_800_q4.json
  eval_seed_split: selection
  final_eval_seed_split: test
  eval_interval: 10
  eval_episodes: 20
  checkpoint_confirmation_enabled: true
  checkpoint_confirmation_split: confirmation

  # Explicitly pin the deployable method and keep failed allocation probes off.
  target_allocation_enabled: false
  target_allocation_teacher_enabled: false
  target_allocation_teacher_differentiable_comm: false
  target_allocation_sinkhorn_enabled: false
