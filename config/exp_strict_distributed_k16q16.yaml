# Frozen-scale strict distributed K16/Q16 evaluation identity.
# The algorithmic and physical settings are inherited from the strict pilot;
# only the scale, target weights and scale-specific blind bank are changed.
extends: exp_strict_distributed_no_truth_pilot.yaml

scenario:
  K: 16
  Q: 16
  T: 150

target:
  omega_q:
    - 0.0625
    - 0.0625
    - 0.0625
    - 0.0625
    - 0.0625
    - 0.0625
    - 0.0625
    - 0.0625
    - 0.0625
    - 0.0625
    - 0.0625
    - 0.0625
    - 0.0625
    - 0.0625
    - 0.0625
    - 0.0625

marl:
  eval_seed_bank_path: config/stratified_seeds_1130_k16q16_blind.json
  eval_seed_split: test
  final_eval_seed_split: test
  # Independent private node LPs execute concurrently. A paired 3-seed/30-frame
  # K16 audit showed bit-exact trajectories, no fallback, and 1.27x mean
  # end-to-end speedup (about 97 ms -> 76 ms per frame).
  distributed_replicated_power_process_parallel_enabled: true
  distributed_replicated_power_process_workers: 4
  distributed_replicated_power_process_timeout_s: 0.1
  distributed_replicated_power_parallel_fallback_to_serial: true
  distributed_replicated_power_parallel_failure_mode: serial
  distributed_replicated_power_deadline_incumbent_relative_tolerance: 0.05
  distributed_replicated_power_max_consecutive_process_failures: 3
