# Phase 1: Minimum System (No Federation, C=1)
# All simulation parameters 鈥?single source of truth

scenario:
  region_size: [400, 400]     # m 鈥?anchored to Device-free MARL ISAC (IEEE TVT 2024): 400x400 m
  height: 20                   # m UAV altitude 鈥?Device-free MARL (TVT 2024): H=20 m
  K: 4                         # number of UAVs
  Q: 2                         # number of moving targets
  T: 150                       # frames per episode (targets are fixed in the default tracking-free study)
  dt: 0.1                      # frame duration (seconds)
  C: 1                         # number of regions (Phase 1: no federation)
  # Post-G2 time-energy closure (audit advice/001 C1, 2026-08-26): one control
  # step executes n_cpi OTFS frames, so the canonical sensing clock is the CPI
  # duration T_sense = n_cpi*N*T_sym (~1.024 ms), NOT the 100 ms dt slot.
  #   dt_frame (legacy, reproducible pre-G2): battery charged P_sense*dt.
  #   cpi_frame (canonical post-G2 manifest): battery charged P_sense*T_sense.
  # The manifest (config/system_manifest.yaml) pins cpi_frame; this file keeps
  # dt_frame so historical certified runs stay reproducible.
  sensing_energy_mode: dt_frame

uav:
  v_max: 25                    # m/s max flight speed
  d_safe: 20                   # m safe separation distance
  P_sense: 0.0251              # W = 14 dBm sensing power 鈥?Device-free MARL (TVT 2024): P^(r)=14 dBm
  P_sense_max: 0.0251          # W hard sensing-waveform cap; joint RF slack may remain unused
  P_report: 0.25               # W reporting power 鈥?Device-free MARL comm power set {0.25..1 W}
  P_isac_total: 1.0            # W per-UAV hard RF cap: P_comm + sum_q P_sense,q <= 1 W
  B_max: 50000                 # J initial battery energy
  P_fly_static: 80             # W hover power (rotorcraft)
  P_fly_coeff: 0.05            # speed-dependent coefficient (P_fly 鈭?v^2)

target:
  motion_model: "CV"           # used only when marl.tracking_enabled=true
  speed_range: [0, 5]          # ignored by the default tracking-free sensing experiment
  sigma_a: 0.5                 # m/s^2 process noise std
  rcs: 1.0                     # m^2 radar cross section
  omega_q: [0.5, 0.5]          # target priorities (equal by default)

otfs:
  fc: 2.8e+10                  # carrier frequency (Hz, mmWave 28 GHz) 鈥?Low-Latency ISAC V2X (28 GHz)
  B: 1.0e+6                    # bandwidth (Hz) 鈥?Device-free MARL (TVT 2024): B=1 MHz
  delta_f: 1.5625e+4           # subcarrier spacing = B/M = 1e6/64
  M: 64                        # delay-dimension bins
  N: 16                        # Doppler-dimension bins
  T_sym: 6.4e-5                # symbol period (s) = 1/delta_f
  g_tx_dBi: 16.0               # tx array gain (64-elem UAV phased array; lit: 8 dBi single / "large arrays")
  g_rx_dBi: 16.0               # rx array gain
  n_cpi: 1                     # G2-0.6: one explicitly executed OTFS frame per control action

channel:
  NF: 4.0                      # noise figure (dB): kT*B*NF = 4e-21*1e6*2.51 = 1e-14 W = -110 dBm (TVT 2024 N0)
  use_los_prob: true           # H=20m low-altitude: Al-Hourani prob. LoS/NLoS on report link (blockage)
  los_a: 4.88                  # suburban Al-Hourani param
  los_b: 0.43                  # suburban Al-Hourani param
  eta_los_dB: 0.1              # LoS excess loss (dB)
  eta_nlos_dB: 21.0            # NLoS excess loss (dB) 鈥?suburban
  use_swerling: false          # optional Swerling-II RCS fading on sensing (default OFF)
  kT: 4.0e-21                  # thermal noise density (W/Hz) at 290K
  ric_K: 6.0                   # Rician K-factor (dB) for reporting link

detection:
  P_FA: 0.001                  # false alarm probability
  c_det: 1.0                   # real Gaussian shift convention D=c_det*Es/En
  g_min: 0.5                   # DD effectiveness threshold (legacy binary gate)
  # Post-G2 DD model (audit advice/001 C1, 2026-08-26): the canonical physics
  # uses the continuous gain I_support * |A(tau,nu)|^2 on deflection
  # (out-of-support targets contribute exactly 0), not the binary
  # 1[g_dd >= g_min] gate.  The manifest pins dd_gain_mode: continuous; this
  # file keeps binary so pre-G2 certified runs stay reproducible.
  dd_gain_mode: binary
  K_q_max: 3                   # max reporting sources per target
  B_q: 64                      # soft info bits per report
  P_D_min: 0.2                 # fairness floor (D4); 0.8 was unreachable -> Lagrangian blowup.
                               # re-tune from run_baselines.py 'steady_P_D' (reachable & binding)

p0_solver:
  capacity_per_rx: 256         # bits per frame per receiving UAV
  latency_max: 0.005           # max latency per rx UAV (s)

marl:
  hidden_layers: [256, 256]    # actor/critic MLP architecture
  # Fixed-structure distributed primal--dual sensing-power block. Default off.
  distributed_primal_dual_power_enabled: false
  distributed_primal_dual_power_rounds: 20
  distributed_primal_dual_power_acceptance_tolerance: 1.0e-10
  distributed_primal_dual_power_cost_per_watt: 1.0e-4
  distributed_primal_dual_power_regularization: 1.0e-3
  distributed_primal_dual_power_actor_proximal_regularization: 0.0
  distributed_primal_dual_power_primal_tolerance: 2.0e-4
  distributed_primal_dual_power_stationarity_tolerance: 2.0e-4
  distributed_primal_dual_power_dual_tolerance: 2.0e-4
  distributed_primal_dual_power_convergence_patience: 3
  # Training-only multi-frame differentiable unroll.  Disabled preserves the
  # historical execution and PPO update path exactly.
  temporal_unrolled_power_enabled: false
  temporal_unrolled_power_horizon: 4
  temporal_unrolled_power_inner_iterations: 4
  temporal_unrolled_power_warm_start_mix: 0.50
  temporal_unrolled_power_detach_between_frames: false
  temporal_unrolled_power_batched_vjp_enabled: true
  temporal_unrolled_power_rf_tangent_enabled: false
  temporal_unrolled_power_rf_tangent_slack_tolerance: 1.0e-6
  temporal_unrolled_power_rf_tangent_rank_tolerance: 1.0e-8
  temporal_unrolled_power_pareto_tolerance: 1.0e-6
  temporal_unrolled_power_pareto_max_iterations: 64
  temporal_feasible_structure_enabled: false
  temporal_feasible_structure_temperature: 0.25
  temporal_feasible_structure_inertia: 0.25
  temporal_feasible_structure_max_structures: 4096
  temporal_feasible_structure_hard_forward: true
  # Simulator-only private-LP process parallelism. It does not enable
  # simultaneous radio transmission and remains off for historical replay.
  distributed_replicated_power_process_parallel_enabled: false
  distributed_replicated_power_history_reserve_pd: 0.0
  distributed_replicated_power_process_workers: 4
  distributed_replicated_power_process_timeout_s: 0.1
  distributed_replicated_power_parallel_fallback_to_serial: true
  distributed_replicated_power_parallel_failure_mode: serial
  distributed_replicated_power_deadline_incumbent_relative_tolerance: 0.05
  distributed_replicated_power_max_consecutive_process_failures: 3
  distributed_replicated_power_certificate_shadow_global_lp_enabled: false
  distributed_composable_certificate_targetwise_upper_enabled: false
  movement_decision_interval: 1 # hold only movement; communication/resources still update each frame
  distributed_id_movement_enabled: false
  distributed_id_movement_standoff_m: 0.0
  distributed_greedy_matching_movement_enabled: false
  distributed_greedy_matching_hold_frames: 150
  distributed_greedy_matching_prediction_frames: 0
  distributed_bottleneck_matching_movement_enabled: false
  distributed_coordination_use_local_belief_targets: false
  # Post-G2 strict no-truth fail-closed gate (audit advice/001 P0).  When true,
  # distributed decision paths never read simulator ground truth; the canonical
  # post-G2 manifest pins true together with local-belief + tracking on.  The
  # legacy default (false) preserves every pre-G2 certified run.
  distributed_no_truth_fail_closed: false
  # Experimental scalar score-order communication.  OFF is mandatory for the
  # current learned aggregate/target-token payloads because no decoder/action
  # certificate connects their quantization error to the final decision.
  distributed_decision_sufficient_comm_enabled: false
  distributed_decision_sufficient_event_trigger_enabled: false
  distributed_decision_sufficient_adaptive_bits_enabled: false
  distributed_decision_sufficient_dynamic_range: 1.0
  distributed_decision_sufficient_max_bits: 32
  distributed_movement_safety_margin_per_age_m: 0.0
  distributed_movement_local_assignment_cache_enabled: false
  distributed_movement_public_max_age_frames: 5
  distributed_movement_stale_fail_closed: false
  distributed_movement_execute_projected_public_action: false
  distributed_movement_outside_invariant_recovery_enabled: false
  distributed_movement_outside_invariant_recovery_gain: 1.0
  distributed_movement_independently_composable_safety: false
  # Permit transmit/receive endpoint roles in different sensing sub-slots of
  # one frame. Disabled for exact backwards compatibility.
  multistatic_subslot_enabled: false
  # Constrain P0 by local sensing-power top-k decisions. Receiver agreement
  # creates a hard rendezvous with no central/oracle fallback.
  distributed_target_commitment_enabled: false
  distributed_target_commitment_topk: 1
  distributed_target_commitment_require_receiver: true
  distributed_target_commitment_mode: hard
  distributed_target_commitment_soft_floor: 0.25
  distributed_target_commitment_uncertainty_relief: 1.0
  distributed_target_commitment_source: sensing_power
  distributed_target_commitment_min_hold_frames: 0
  distributed_target_commitment_handover_frames: 0
  distributed_target_commitment_max_age_frames: 5
  # QPD-ISAC is an opt-in distributed optimization gate. The queue uses
  # z <- [z + eta(P_floor-P_local)]_+; low local QoS therefore raises price.
  qpd_isac_enabled: false
  qpd_qos_floor: 0.60
  qpd_queue_step: 0.25
  qpd_queue_max: 4.0
  qpd_primal_step: 1.0
  qpd_dual_step: 0.25
  qpd_rounds: 2
  qpd_row_capacity: 2.0
  qpd_target_capacity: 2.0
  qpd_price_max: 4.0
  qpd_primal_exploration_floor: 0.02
  qpd_peer_deficit_gain: 2.0
  qpd_send_threshold: 0.05
  qpd_bid_change_weight: 1.0
  qpd_power_cost: 0.02
  qpd_comm_cost: 0.01
  qpd_switch_cost: 0.02
  qpd_capability_distance_scale_m: 150.0
  qpd_commitment_threshold: 0.25
  qpd_override_token_mask: true
  qpd_overwrite_protocol_header: true
  qpd_override_sensing_weights: true
  # Learning-free directed Tx/Rx hyperedge negotiation. The three-field
  # [tx capability, rx capability, local QoS deficit] stream is appended to
  # physically transmitted target tokens and charged at the selected rate.
  hyperedge_negotiation_enabled: false
  hyperedge_acceleration_backend: numpy
  deflection_materialization_backend: numpy
  acceleration_golden_trace_enabled: false
  strict_batch_observation_enabled: true
  hyperedge_share_topk: 4
  hyperedge_distance_scale_m: 150.0
  hyperedge_capability_mode: exponential
  hyperedge_deficit_gain: 2.0
  hyperedge_proxy_floor: 0.25
  hyperedge_pair_score_mode: endpoint_proxy
  # replicated_global | reserved_endpoint | refined_endpoint
  hyperedge_coordination_mode: replicated_global
  hyperedge_state_stream_enabled: false
  # Dedicated state beacons may suppress the unused learned target token.
  # A value of zero keeps the actor-selected message precision.
  hyperedge_protocol_only_enabled: false
  hyperedge_state_bits_per_dim: 0
  hyperedge_tx_coalition_max: 2
  hyperedge_robust_quantization_enabled: false
  hyperedge_bistatic_information_ranking_enabled: false
  hyperedge_bistatic_information_weight: 1.0
  hyperedge_reserved_tx_nodes: []
  hyperedge_consensus_rounds: 2
  hyperedge_assignment_hold_frames: 1
  hyperedge_min_target_coverage: 1.0
  hyperedge_safety_fallback_enabled: true
  p0_maxmin_pairing_enabled: false
  p0_maxmin_bypass_commitment_filter: false
  p0_maxmin_pairing_hold_frames: 1
  p0_maxmin_local_fusion_enabled: false
  p0_maxmin_event_triggered_enabled: false
  p0_maxmin_deficit_priority_gain: 3.0
  p0_budget_coupled_structure_enabled: false
  p0_budget_coupled_time_limit_s: 5.0
  p0_budget_coupled_secondary_enabled: true
  p0_budget_coupled_solver_mode: milp
  p0_legacy_guard_qos_floors: []
  p0_maxmin_event_qos_enabled: true
  p0_topology_min_change_repair_enabled: false
  tracking_enabled: false      # fixed mission-known sensing targets; no Kalman tracking loop
  belief_expected_detection_information_enabled: false
  belief_expected_detection_information_floor: 0.001
  belief_measurement_model: cartesian
  belief_bistatic_crlb_efficiency: 4.0
  belief_bistatic_min_effective_deflection: 0.001
  distributed_owner_posterior_enabled: false
  distributed_owner_posterior_mean_bits: 12
  distributed_owner_posterior_cov_bits: 8
  distributed_owner_posterior_aoi_bits: 8
  distributed_owner_posterior_max_age_frames: 5
  detection_fusion_mode: local_only # legacy_global | central_oracle | local_only | u2u_distributed
  passive_multireceiver_evidence_enabled: false
  passive_multireceiver_belief_update_enabled: false
  u2u_belief_feedback_enabled: false
  u2u_belief_feedback_mean_bits: 12
  u2u_belief_feedback_cov_bits: 8
  u2u_belief_feedback_aoi_bits: 8
  u2u_belief_feedback_max_age_frames: 5
  distributed_target_position_uncertainty_sigma: 0.0
  distributed_replicated_power_robust_gain_mix: 0.0
  evidence_packet_topk: 1
  evidence_packet_ambiguity_top2_enabled: false
  evidence_packet_ambiguity_ratio: 0.5
  evidence_packet_ambiguity_min_deflection: 0.0
  evidence_packet_owner_aware: true
  evidence_packet_llr_bits: 8
  evidence_packet_confidence_bits: 2
  evidence_packet_clip_max: 0.0
  evidence_packet_standardized_threshold: 0.0
  evidence_packet_confidence_log_boundaries: []
  evidence_packet_confidence_representatives: []
  evidence_packet_mc_draws: 2048
  evidence_packet_mc_seed: 20260725
  evidence_packet_content_mode: normal
  evidence_packet_calibration_profile: ""
  ground_communication_enabled: false  # paper scope: U2U only, no UAV-ground reporting link
  learned_comm_mode: cost_aware        # learned content + learned silence/rate action
  comm_only_neighbor_information: true # no free neighbour state/intent side channel
  comm_cross_attention_enabled: true   # target queries individual sender-message tokens
  comm_message_ttl_frames: 5           # retain last delivered token with increasing AoI
  comm_rate_bits_per_dim: [0, 4, 8, 16, 32] # retain low-cost rates; add optional high-precision rate
  comm_header_bits: 64
  comm_bandwidth_hz: 100000
  comm_tx_power_w: 0.25
  comm_deadline_s: 0.005
  comm_processing_delay_s: 0.0002
  comm_snr_threshold_db: 0.0
  comm_antenna_gain_dbi: 0.0
  # Optional finite-blocklength normal approximation. Disabled to preserve
  # historical Shannon artifacts; opt-in runs must report the target BLER.
  comm_finite_blocklength_enabled: false
  comm_finite_blocklength_target_bler: 0.00001
  comm_finite_blocklength_max_channel_uses: 100000000
  comm_finite_blocklength_sample_errors: true
  comm_finite_blocklength_coding_snr_margin_db: 0.0
  comm_snr_shadowing_std_db: 0.0
  comm_snr_shadowing_correlation: 0.0
  comm_burst_loss_enabled: false
  comm_burst_good_to_bad_probability: 0.0
  comm_burst_bad_to_good_probability: 1.0
  comm_burst_good_drop_probability: 0.0
  comm_burst_bad_drop_probability: 1.0
  analytical_comm_snr_margin_db: 0.0
  # Episode-level paired channel profiles for robust-policy training.
  # Disabled by default, so formal fixed-channel evaluation is unchanged.
  comm_channel_randomization_enabled: false
  comm_channel_randomization_snr_threshold_db_values: []
  comm_channel_randomization_deadline_s_values: []
  comm_channel_randomization_profile_weights: []
  comm_message_log_std_init: -1.0
  comm_entropy_scale: 0.1       # let rate decisions commit while movement still explores
  comm_payload_mode: aggregate  # aggregate | target_tokens
  comm_target_token_dim: 16
  joint_isac_power_enabled: false # opt-in learned P_comm + multi-target sensing split
  comm_power_fraction_min: 0.0
  comm_power_fraction_max: 1.0
  isac_power_log_std_init: -1.0
  sensing_allocation_log_std_init: -1.0
  comm_bit_cost_weight: 0.00001
  comm_energy_cost_weight: 1.0
  comm_delay_cost_weight: 10.0
  comm_qos_constrained: true
  comm_qos_steady_min: 0.80
  comm_qos_weak3_min: 0.70
  comm_qos_worst_min: 0.60
  comm_qos_dual_lr: 0.05
  comm_qos_lambda_init: 0.5
  comm_qos_lambda_max: 5.0
  comm_qos_reward_scale: 1.0
  # Encourage successful participation while QoS is poor, but keep transport
  # costly so the policy must learn when communication is actually worthwhile.
  # The bonus is rate-neutral: 4/8/16/32 bit packets receive the same bonus.
  comm_encouragement_enabled: true
  comm_encouragement_weight: 0.05
  comm_encouragement_floor_ratio: 0.10
  # While QoS is infeasible, softly encourage precision up to 8 bit/dim.
  # Higher rates remain available but must justify their additional cost.
  comm_rate_bonus_enabled: true
  comm_rate_bonus_weight: 0.03
  comm_rate_bonus_target_bits: 8
  comm_rate_bonus_aux_coef: 1.0
  comm_rate_bonus_aux_lr: 0.01
  # Permit three consecutive silent policy decisions (15 simulator frames in
  # the Medium config's 5-frame decision interval), then charge 0.01 per
  # additional decision up to a 0.05 cap.
  comm_silence_penalty_enabled: true
  comm_silence_grace_decisions: 3
  comm_silence_penalty_per_decision: 0.01
  comm_silence_penalty_max: 0.05
  comm_eval_force_silence: false
  comm_eval_force_rate_bits: -1
  comm_eval_message_ablation: none
  eval_centralized_assignment_movement: false
  eval_qos_bistatic_assignment_movement: false
  # Hard minimum-rate forcing is retained only as an ablation and is OFF.
  comm_qos_min_rate_bits: 0
  comm_qos_rate_shortfall_penalty: 0.0
  comm_qos_rate_aux_coef: 0.0
  # Experimental soft assignment is disabled by default: symmetric training can
  # collapse to a uniform assignment and degraded the Medium worst-case score.
  target_allocation_enabled: false
  target_allocation_balance_coef: 0.20
  target_allocation_commit_coef: 0.01
  target_allocation_temperature: 1.0
  target_allocation_straight_through: false
  target_allocation_movement_blend: 0.0
  target_allocation_movement_confidence_gating_enabled: false
  target_allocation_movement_confidence_floor: 0.0
  target_allocation_movement_confidence_power: 2.0
  target_allocation_movement_blend_start: 0.0
  target_allocation_movement_blend_end: 0.0
  target_allocation_movement_blend_anneal_frames: 0
  hierarchical_dual_assignment_enabled: false
  movement_team_matching_enabled: false
  movement_team_matching_temperature: 0.35
  movement_team_matching_iterations: 16
  movement_team_matching_blend: 0.0
  movement_team_matching_intrinsic_bid_mix: 0.0
  target_allocation_resource_blend: 0.0
  target_allocation_differentiable_comm: false
  target_allocation_comm_delay_decisions: 1
  target_allocation_temporal_coef: 0.0
  target_allocation_aux_epochs: 1
  target_allocation_aux_lr: 0.0
  round_negotiation_enabled: false
  round_negotiation_strength: 0.5
  round_negotiation_temperature: 0.5
  sparse_claim_enabled: false
  sparse_claim_share_topk: 2
  sparse_claim_commit_topk: 2
  sparse_claim_desired_endpoints: 2
  sparse_claim_full_penalty: 2.0
  sparse_claim_vacant_bonus: 0.5
  sparse_claim_temperature: 0.25
  sparse_claim_underload_coef: 4.0
  sparse_claim_overload_coef: 1.0
  adaptive_topk_from_rate_enabled: false
  adaptive_topk_rate_mapping: [0, 1, 2]
  adaptive_topk_rate_only_training: false
  adaptive_topk_reset_rate_head: false
  adaptive_topk_worst_credit_coef: 0.0
  comm_rate_metadata_denominator: null
  comm_channel_feedback_rate_enabled: false
  comm_channel_feedback_dim: 6
  comm_sender_delivery_penalty_enabled: false
  comm_sender_delivery_penalty_weight: 0.05
  comm_aided_sensing_enabled: false
  comm_aided_sensing_blend: 1.0
  comm_aided_sensing_aux_coef: 1.0
  comm_aided_sensing_counterfactual_coef: 0.5
  comm_aided_sensing_temperature: 0.25
  comm_aided_sensing_margin: 0.02
  comm_semantic_decoder_enabled: false
  comm_semantic_capacity_bid_enabled: false
  comm_semantic_capacity_bid_gain: 0.0
  comm_semantic_extra_token_enabled: false
  comm_semantic_extra_token_threshold: 0.10
  # Communication-induced motion is opt-in. The endpoint-deficit field uses
  # only physically delivered sparse claims and remains exactly zero in silence.
  semantic_kinematic_field_enabled: false
  semantic_kinematic_field_gain: 0.15
  target_conditioned_movement_enabled: false
  target_conditioned_movement_gain: 0.15
  target_allocation_movement_only: false
  # Optional CTDE distillation of a balanced one-UAV/one-target coverage
  # assignment. Disabled until the learned-policy probe passes; the oracle
  # itself reaches 0.905/0.873/0.731 on the fixed Medium validation bank.
  target_allocation_teacher_enabled: false
  target_allocation_teacher_label_coef: 0.20
  target_allocation_teacher_movement_coef: 0.50
  target_allocation_teacher_message_coef: 0.05
  target_allocation_teacher_epochs: 1
  target_allocation_teacher_differentiable_comm: false
  target_allocation_teacher_switching_penalty_m: 0.0
  target_allocation_teacher_mode: distance
  target_allocation_teacher_qos_floor: 0.60
  target_allocation_teacher_qos_weight: 2.0
  target_allocation_teacher_commitment_frames: 5
  target_allocation_teacher_height_m: 20.0
  target_allocation_teacher_crisis_only_enabled: false
  target_allocation_teacher_crisis_floor: 0.60
  target_allocation_sinkhorn_enabled: false
  capacity_matching_enabled: false
  capacity_matching_row_capacity: 2
  capacity_matching_column_capacity: 2
  capacity_matching_temperature: 0.35
  capacity_matching_iterations: 32
  capacity_matching_blend_start: 0.0
  capacity_matching_blend_end: 1.0
  capacity_matching_anneal_frames: 100000
  lr: 0.0003                   # Adam learning rate
  gamma: 0.99                  # discount factor
  gae_lambda: 0.95             # GAE 位
  ppo_clip: 0.2                # PPO clip 蔚
  ppo_epochs: 4                # 10 -> 4: fewer epochs/rollout -> less overfit -> no policy collapse
  rollout_steps: 2048          # tuned (stable MAPPO); single source of truth
  minibatch_size: 256          # SGD minibatch size
  entropy_init: 0.08           # 0.03 -> 0.08: belief fix's strong gradient overwhelmed 0.03 -> raise
  entropy_final: 0.08          # constant 0.08
  entropy_decay_frames: 1000000 # frames over which entropy decays
  eta_mc: 0.5                  # marginal contribution shaping coefficient
  use_distance_shaping: false  # OFF: slow-target curriculum makes detection reward dense enough;
                               # the coverage-distance proxy was misaligned with bistatic P_D (hurt last run)
  shape_w: 0.01                # distance-shaping weight (only used if enabled)
  lambda_report: 1.0e-5        # comms-cost weight; small vs detection utility (was 1e-3 -> P_D collapse)
  # Auditable coordination reward. Keep stage 0 by default so legacy training
  # is numerically unchanged; staged experiment YAMLs enable one term at a time.
  coord_reward_enabled: false
  coord_reward_stage: 0         # 0=log, 1=worst, 2=+duplicate, 3=+weak3, 4=+steady
  coord_reward_ema_alpha: 0.20
  coord_reward_steady_floor: 0.80
  coord_reward_weak3_floor: 0.70
  coord_reward_worst_floor: 0.60
  coord_reward_worst_weight: 1.00
  coord_reward_duplicate_weight: 0.01
  coord_reward_weak3_weight: 0.50
  coord_reward_steady_weight: 0.25
