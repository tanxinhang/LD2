# Decoupled belief-feedback freshness scheduling (audit priority #3).
#
# The legacy schedule rides every quantized posterior on the evidence top-1
# selection, whose objective is detection-evidence quality, not information
# freshness.  This variant decouples the posterior broadcast: each source ranks
# its own local posteriors by the joint AoI / position-uncertainty / task-loss
# score and broadcasts its top-2 entries (owner-aware), while the evidence
# selection stays quality-based.  The packet carries the union of evidence and
# belief entries; every scheduled posterior pays its 88-bit state payload.
extends: exp_800_k12q12_distributed_v2_dynamic_u2u_robustbelief_pilot.yaml

marl:
  u2u_belief_feedback_schedule: freshness
  u2u_belief_feedback_topk: 2
  # Fully charged sparse schedule: ~400 posterior bits/frame (4 entries)
  # select the highest-need beliefs. A posterior may share target metadata
  # with an evidence entry, but its 88-bit state is always charged. The
  # per-source union cap (evidence union posterior <= 2) bounds every packet
  # so the evidence broadcast stays inside the per-class deadline in most
  # frames; the serialized two-class 4 ms deadline remains a separate gate.
  u2u_belief_feedback_bit_budget: 400
  u2u_belief_feedback_max_union_per_source: 2
  u2u_belief_feedback_aoi_weight: 0.3333333333333333
  u2u_belief_feedback_uncertainty_weight: 0.3333333333333333
  u2u_belief_feedback_task_weight: 0.3333333333333333
  u2u_belief_feedback_owner_aware: true
