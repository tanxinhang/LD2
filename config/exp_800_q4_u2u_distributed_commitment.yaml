# Structural necessity probe: each transmitter locally commits to one target
# through its learned sensing allocation. P0 may optimize only within those
# commitments and can no longer choose the target on the UAV's behalf.
extends: exp_800_q4_u2u_headwise_credit.yaml

marl:
  distributed_target_commitment_enabled: true
  distributed_target_commitment_topk: 1
  distributed_target_commitment_require_receiver: false
  learn_roles: false
