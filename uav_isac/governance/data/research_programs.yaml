# Active scientific work only. Historical probes remain reproducible but are
# not promoted into this registry merely because their scripts still exist.
schema_version: 1
programs:
  - name: l4_markov_assignment_dp
    question: Can a finite-state Markov assignment path with physical future-stage costs improve L4 tail detection without assignment churn?
    state: shadow_kernel_ready
    implementation: uav_isac/prediction/markov_physical_assignment.py
    profile: config/exp_research_l4_markov_prediction_h10.yaml
    evidence: docs/L4_MARKOV_PREDICTION_2026-09-10.md
    formal_eligible: false
    next_gate: Feed causal local-belief covariance horizons and bounded assignment neighborhoods into shadow logging, then test ranking agreement with executed next-stage tail detection before granting action authority.

  - name: l4_markov_prediction
    question: Does causal one-second CV-Markov target prediction improve L4 distributed bistatic assignment without clean-regime regression?
    state: falsified
    implementation: uav_isac/prediction/markov_kinematics.py
    profile: config/exp_research_l4_markov_prediction_h10.yaml
    evidence: artifacts/research/l4_markov_prediction_h10_v1.json
    formal_eligible: false
    next_gate: Replace endpoint-mean matching with a distinct path-integrated uncertainty-aware score before any new confirmation.

  - name: l4_short_assignment_commitment
    question: Does a shorter distributed assignment commitment improve worst-target detection under the L4 disturbance protocol at unchanged resources?
    state: candidate
    implementation: uav_isac/legacy/environment_core.py
    profile: config/exp_research_l4_adaptive_assignment_h5.yaml
    evidence: artifacts/research/l4_assignment_optimization_v1.json
    formal_eligible: false
    next_gate: Preregister a lower-tail endpoint and acceptance rule, then evaluate H5 against H20 on a new untouched paired bank while retaining mean-worst and L0 regression guards.

  - name: k16q16_disturbance_ladder
    question: Can a candidate improve worst-target detection under simple sensing, synchronization, maneuver and receiver-load stress without degrading the clean control?
    state: candidate
    implementation: tools/run_strict_distributed_pilot.py
    profile: config/exp_research_interference_l4_noise_loaded.yaml
    evidence: artifacts/research/interference_ladder_calibration_v1.json
    formal_eligible: false
    next_gate: Compare candidates on paired non-test development seeds across L0--L4, then seal an independent confirmation bank.

  - name: strict_k16q16_baseline
    question: Can the frozen distributed controller satisfy the preregistered K16/Q16 blind protocol?
    state: frozen_baseline
    implementation: tools/run_strict_distributed_bank.py
    profile: config/exp_strict_distributed_k16q16.yaml
    evidence: formal_evidence/registry.json
    formal_eligible: true
    next_gate: Preserve as the paired control for every post-refactor algorithm experiment.

  - name: constrained_temporal_power
    question: Can teacher-free constrained optimization improve executed tail detection without violating RF, CVaR, or KL constraints?
    state: candidate
    implementation: uav_isac/optimization/temporal_feasible_structure.py
    profile: config/exp_temporal_feasible_structure_smoke.yaml
    evidence: artifacts/research/feasibility_first_confirmation_v1.json
    formal_eligible: false
    next_gate: Replace the saturated temporal max-tail CVaR signal and demonstrate surrogate-to-executed monotonicity on calibration seeds before preregistering another confirmation.

  - name: predictive_constraint_native
    question: Can a scale-equivariant predictor reduce exact-solver work while retaining certified feasibility on unseen seeds and cardinalities?
    state: shadow_incomplete
    implementation: uav_isac/prediction/certified_gnn.py
    profile: config/exp_strict_distributed_k16q16.yaml
    evidence: docs/PREDICTIVE_CERTIFIED_ARCHITECTURE_2026-09-07.md
