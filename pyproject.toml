[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-isac"
version = "2.0.0a0"
description = "Reproducible distributed multi-UAV ISAC research system"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "threadpoolctl>=3.1",
  "torch>=2.10",
  "PyYAML>=6.0",
  "gymnasium>=0.29",
  "networkx>=3.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.0",
  "scikit-learn>=1.2",
]

[project.scripts]
uav-isac = "uav_isac.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["uav_isac*", "config*"]

[tool.setuptools.package-data]
config = ["*.yaml", "*.yml", "*.json"]
uav_isac = ["governance/data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
