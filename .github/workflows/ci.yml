name: CI

# The simulator's reference runtime is Windows.  Persistent private LP workers
# and Torch/MKL runtime loading are validated on that platform.  results/ is
# git-ignored, so historical artifact checks self-skip in CI; synthetic formal
# gate tests still exercise the current evidence contract.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-ci.txt
          python -m pip check

      - name: Run full test suite
        run: python -m pytest tests/ -q

      - name: Verify frozen system identity
        run: >-
          python tools/check_system_identity.py
          --manifest config/exp_strict_distributed_k16q16.yaml
          --strict --commit "${{ github.sha }}"

      - name: Verify detector normalization gate
        run: python tools/audit_detector_normalization.py --assert-ready
